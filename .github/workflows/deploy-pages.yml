name: Deploy GitHub Pages

# Production: https://<org>.github.io/<repo>/
# Previews:  https://<org>.github.io/<repo>/preview/<branch-slug>/  (see deploy-pages-preview.yml)
#
# Both workflows publish to the gh-pages branch (keep_files: true so they coexist).
# GitHub Pages → Settings → Build and deployment → Source: Deploy from branch → gh-pages / root

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Generate static site
        run: pnpm run generate
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          NUXT_PUBLIC_SUPABASE_URL: ${{ vars.NUXT_PUBLIC_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NUXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy production to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .output/public
          keep_files: true
